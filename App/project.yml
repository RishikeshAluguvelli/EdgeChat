name: EdgeChat
options:
  bundleIdPrefix: com.rishikesh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4J6HRDQT39
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  EdgeChatCore:
    path: ".."
targets:
  EdgeChat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EdgeChat
        excludes: ["Info.plist"]
    dependencies:
      - package: EdgeChatCore
        product: EdgeChatCore
    info:
      path: EdgeChat/Info.plist
      properties:
        CFBundleDisplayName: EdgeChat
        CFBundleName: EdgeChat
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Attach photos so the on-device model can look at them. Nothing leaves your phone."
        NSCameraUsageDescription: "Take a photo for the on-device model to analyze. Nothing leaves your phone."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GGUF model
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.ggml.gguf]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ggml.gguf
            UTTypeDescription: GGUF model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gguf]
    entitlements:
      path: EdgeChat/EdgeChat.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishikesh.edgechat
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
schemes:
  EdgeChat:
    build:
      targets:
        EdgeChat: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
