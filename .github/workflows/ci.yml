name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: swift build + unit tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Cache llama.cpp xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Frameworks/llama.xcframework
          key: llama-xcframework-b10988
      - name: Fetch llama.cpp xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: scripts/setup-llama.sh
      - name: Build package and CLI
        run: swift build -c release
      - name: Unit tests (engine tests skip without model files)
        run: swift test

  android:
    name: android assembleDebug (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install NDK and CMake (runner ships the Android SDK)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Cache llama.cpp checkout
        uses: actions/cache@v4
        with:
          path: android/third_party/llama.cpp
          key: llama-cpp-src-b10988
      - name: Fetch llama.cpp source
        run: scripts/setup-llama-android.sh
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
